name: Update GitHub Profile Details

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-details.yml"

jobs:
  generate-profile-details:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch original Vercel card and fix title
        run: |
          mkdir -p profile

          python3 <<'PY'
          import urllib.request
          import re
          from pathlib import Path

          url = (
              "https://github-profile-summary-cards.vercel.app/"
              "api/cards/profile-details"
              "?username=ANSHAM1&theme=dracula"
          )

          output = Path("profile/profile-details.svg")

          # ----------------------------------------------------------
          # Fetch the ORIGINAL Vercel SVG
          # ----------------------------------------------------------

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request) as response:
              svg = response.read().decode("utf-8")

          # ----------------------------------------------------------
          # Replace ONLY the profile title.
          #
          # Original:
          #
          #   ANSHAM1 (ANSHAM MAURY...)
          #
          # Desired:
          #
          #   ANSHAM1
          #
          # Everything else in the SVG remains untouched.
          # ----------------------------------------------------------

          pattern = r'(>ANSHAM1\s*\([^<]*\)</text>)'

          replacement = '>ANSHAM1</text>'

          modified, count = re.subn(
              pattern,
              replacement,
              svg,
              count=1
          )

          if count == 0:
              print(
                  "WARNING: Original title was not found."
              )
              print(
                  "The Vercel SVG structure may have changed."
              )

              raise SystemExit(1)

          # ----------------------------------------------------------
          # Write the modified Vercel SVG
          # ----------------------------------------------------------

          output.write_text(
              modified,
              encoding="utf-8"
          )

          print(
              "Successfully generated:"
          )

          print(
              "profile/profile-details.svg"
          )

          print(
              "Changed: profile title only"
          )

          print(
              "Graph/theme/layout: unchanged"
          )

          PY

      - name: Commit updated profile card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/profile-details.svg

          git commit \
            -m "Update GitHub profile details" \
            || exit 0

          git push
