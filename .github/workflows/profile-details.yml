name: Update GitHub Profile Details

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-details.yml"

jobs:
  generate-profile-details:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 1. Download ORIGINAL Vercel card
      # ============================================================

      - name: Download Vercel Profile Details
        run: |
          mkdir -p profile

          curl -L \
            "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=ANSHAM1&theme=dracula" \
            -o profile/profile-details.svg

      # ============================================================
      # 2. Replace ONLY the title
      # ============================================================

      - name: Fix Profile Name
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("profile/profile-details.svg")

          svg = path.read_text(encoding="utf-8")

          # Replace the title text inside the first text element.
          #
          # Vercel generates something similar to:
          #
          # ANSHAM1 (ANSHAM MAURY...
          #
          # We replace ONLY that displayed title with:
          #
          # ANSHAM1

          pattern = re.compile(
              r'(<text[^>]*>)(.*?)(</text>)',
              re.DOTALL
          )

          matches = list(pattern.finditer(svg))

          if not matches:
              raise SystemExit(
                  "Could not find any <text> elements in SVG"
              )

          # The first text element is the profile title
          # in the profile-details card.

          first = matches[0]

          replacement = (
              first.group(1)
              + "ANSHAM1"
              + first.group(3)
          )

          svg = (
              svg[:first.start()]
              + replacement
              + svg[first.end():]
          )

          path.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              "Profile name changed to: ANSHAM1"
          )
          PY

      # ============================================================
      # 3. Commit modified Vercel SVG
      # ============================================================

      - name: Commit Profile Details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/profile-details.svg

          git commit \
            -m "Update GitHub profile details" \
            || exit 0

          git push
