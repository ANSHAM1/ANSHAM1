name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST every day

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate self-hosted SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ANSHAM1
        run: |
          mkdir -p profile

          python3 <<'PY'
          import json
          import math
          import os
          import html
          import urllib.request
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GH_TOKEN"]

          # ============================================================
          # THEME
          # ============================================================

          BG = "#282a36"
          PANEL = "#21222c"
          TEXT = "#f8f8f2"
          MUTED = "#6272a4"
          BORDER = "#44475a"

          PINK = "#ff79c6"
          PURPLE = "#bd93f9"
          BLUE = "#8be9fd"
          GREEN = "#50fa7b"
          YELLOW = "#f1fa8c"
          ORANGE = "#ffb86c"

          FONT = "Arial, Helvetica, sans-serif"

          COLORS = [
              PINK,
              PURPLE,
              BLUE,
              GREEN,
              YELLOW,
              ORANGE,
          ]

          # ============================================================
          # GITHUB GRAPHQL
          # ============================================================

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {

              login
              name
              createdAt

              followers {
                totalCount
              }

              following {
                totalCount
              }

              repositories(
                first: 100
                ownerAffiliations: OWNER
                privacy: PUBLIC
              ) {

                totalCount

                nodes {

                  name
                  stargazerCount
                  forkCount

                  primaryLanguage {
                    name
                  }

                  languages(
                    first: 20
                    orderBy: {
                      field: SIZE
                      direction: DESC
                    }
                  ) {

                    edges {
                      size

                      node {
                        name
                      }
                    }
                  }
                }
              }

              contributionsCollection(
                from: $from
                to: $to
              ) {

                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalRepositoryContributions

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)

          variables = {
              "login": USERNAME,
              "from": start.strftime(
                  "%Y-%m-%dT00:00:00Z"
              ),
              "to": now.strftime(
                  "%Y-%m-%dT23:59:59Z"
              ),
          }

          payload = json.dumps({
              "query": query,
              "variables": variables,
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "ANSHAM1-profile-stats",
              },
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(
                  response.read()
              )

          if "errors" in result:
              print(
                  json.dumps(
                      result["errors"],
                      indent=2,
                  )
              )
              raise SystemExit(
                  "GitHub API request failed"
              )

          user = result["data"]["user"]
          repos = user["repositories"]["nodes"]

          contributions = (
              user["contributionsCollection"]
          )

          calendar = (
              contributions["contributionCalendar"]
          )

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days.sort(
              key=lambda x: x["date"]
          )

          # ============================================================
          # BASIC DATA
          # ============================================================

          total_contributions = (
              calendar["totalContributions"]
          )

          total_commits = (
              contributions[
                  "totalCommitContributions"
              ]
          )

          total_prs = (
              contributions[
                  "totalPullRequestContributions"
              ]
          )

          total_issues = (
              contributions[
                  "totalIssueContributions"
              ]
          )

          total_repo_contributions = (
              contributions[
                  "totalRepositoryContributions"
              ]
          )

          public_repos = (
              user["repositories"]["totalCount"]
          )

          followers = (
              user["followers"]["totalCount"]
          )

          following = (
              user["following"]["totalCount"]
          )

          total_stars = sum(
              repo["stargazerCount"]
              for repo in repos
          )

          total_forks = sum(
              repo["forkCount"]
              for repo in repos
          )

          # ============================================================
          # STREAK
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).date().isoformat()

          streak_days = days[:]

          if streak_days:

              last = streak_days[-1]

              if (
                  last["date"] == today
                  and last["contributionCount"] == 0
              ):
                  streak_days = streak_days[:-1]

          current_streak = 0

          for day in reversed(streak_days):

              if day["contributionCount"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0
          streak_start = None

          longest_start = None
          longest_end = None

          for day in days:

              if day["contributionCount"] > 0:

                  if streak_start is None:
                      streak_start = day["date"]

                  running += 1

                  if running > longest_streak:

                      longest_streak = running
                      longest_start = streak_start
                      longest_end = day["date"]

              else:

                  running = 0
                  streak_start = None

          # ============================================================
          # LANGUAGES
          # ============================================================

          repo_language_count = defaultdict(int)
          language_bytes = defaultdict(int)

          for repo in repos:

              primary = repo["primaryLanguage"]

              if primary and primary["name"]:

                  repo_language_count[
                      primary["name"]
                  ] += 1

              for edge in repo["languages"]["edges"]:

                  language = edge["node"]["name"]

                  if language:
                      language_bytes[
                          language
                      ] += edge["size"]

          # Repositories per language

          repo_total = sum(
              repo_language_count.values()
          )

          repo_languages = []

          if repo_total:

              repo_languages = sorted(
                  [
                      (
                          language,
                          (
                              count
                              / repo_total
                          ) * 100,
                      )
                      for language, count
                      in repo_language_count.items()
                  ],
                  key=lambda x: x[1],
                  reverse=True,
              )

          # Code/language distribution

          bytes_total = sum(
              language_bytes.values()
          )

          language_distribution = []

          if bytes_total:

              language_distribution = sorted(
                  [
                      (
                          language,
                          (
                              size
                              / bytes_total
                          ) * 100,
                      )
                      for language, size
                      in language_bytes.items()
                  ],
                  key=lambda x: x[1],
                  reverse=True,
              )

          # ============================================================
          # HELPERS
          # ============================================================

          def esc(value):
              return html.escape(
                  str(value)
              )

          def number(value):
              return f"{value:,}"

          def date_text(value):

              if not value:
                  return "N/A"

              return datetime.strptime(
                  value,
                  "%Y-%m-%d"
              ).strftime("%d %b %Y")

          def base_svg(
              width,
              height,
              title,
              subtitle
          ):

              return f'''<svg
              xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}">

              <defs>

                <linearGradient
                  id="gradient"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="0%">

                  <stop
                    offset="0%"
                    stop-color="{PINK}"/>

                  <stop
                    offset="50%"
                    stop-color="{PURPLE}"/>

                  <stop
                    offset="100%"
                    stop-color="{BLUE}"/>

                </linearGradient>

                <linearGradient
                  id="mountain"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="0%">

                  <stop
                    offset="0%"
                    stop-color="{PINK}"
                    stop-opacity="0.15"/>

                  <stop
                    offset="50%"
                    stop-color="{PURPLE}"
                    stop-opacity="0.30"/>

                  <stop
                    offset="100%"
                    stop-color="{BLUE}"
                    stop-opacity="0.15"/>

                </linearGradient>

              </defs>

              <rect
                width="{width}"
                height="{height}"
                rx="16"
                fill="{BG}"/>

              <text
                x="28"
                y="34"
                fill="{PINK}"
                font-family="{FONT}"
                font-size="18"
                font-weight="700">

                {esc(title)}

              </text>

              <text
                x="28"
                y="55"
                fill="{BLUE}"
                font-family="{FONT}"
                font-size="11">

                {esc(subtitle)}

              </text>

              <line
                x1="28"
                y1="72"
                x2="{width - 28}"
                y2="72"
                stroke="{BORDER}"/>

              '''

          def write(name, svg):
              Path(
                  f"profile/{name}"
              ).write_text(
                  svg,
                  encoding="utf-8"
              )

          # ============================================================
          # CARD 1
          # PROFILE DETAILS / CONTRIBUTION GRAPH
          # ============================================================

          WIDTH = 1100
          HEIGHT = 420

          svg = base_svg(
              WIDTH,
              HEIGHT,
              user["name"] or USERNAME,
              f"@{USERNAME}"
          )

          graph_days = days[-365:]

          graph_values = [
              day["contributionCount"]
              for day in graph_days
          ]

          max_value = max(
              graph_values
          ) if graph_values else 1

          GX = 28
          GY = 95
          GW = 1044
          GH = 190

          points = []

          for index, value in enumerate(
              graph_values
          ):

              x = (
                  GX
                  + (
                      index
                      / max(
                          1,
                          len(graph_values) - 1
                      )
                  )
                  * GW
              )

              y = (
                  GY
                  + GH
                  - (
                      value
                      / max_value
                      * GH
                  )
              )

              points.append(
                  (x, y)
              )

          line = " ".join(
              f"{x:.2f},{y:.2f}"
              for x, y in points
          )

          polygon = (
              f"{GX},{GY + GH} "
              + line
              + f" {GX + GW},{GY + GH}"
          )

          svg += f'''

          <text
            x="28"
            y="92"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9">

            CONTRIBUTIONS

          </text>

          <text
            x="1072"
            y="92"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9"
            text-anchor="end">

            {date_text(graph_days[0]["date"])}
            — {date_text(graph_days[-1]["date"])}

          </text>

          <polygon
            points="{polygon}"
            fill="url(#mountain)"/>

          <polyline
            points="{line}"
            fill="none"
            stroke="url(#gradient)"
            stroke-width="3"
            stroke-linejoin="round"
            stroke-linecap="round"/>

          <line
            x1="{GX}"
            y1="{GY + GH}"
            x2="{GX + GW}"
            y2="{GY + GH}"
            stroke="{BORDER}"/>

          '''

          # Contribution date labels

          for index in [
              0,
              len(graph_days) // 2,
              len(graph_days) - 1,
          ]:

              x = (
                  GX
                  + (
                      index
                      / max(
                          1,
                          len(graph_days) - 1
                      )
                  )
                  * GW
              )

              svg += f'''

              <text
                x="{x:.2f}"
                y="303"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="9"
                text-anchor="middle">

                {date_text(graph_days[index]["date"])}

              </text>

              '''

          # Bottom stats

          stats = [
              (
                  "TOTAL CONTRIBUTIONS",
                  total_contributions,
                  PINK,
              ),
              (
                  "CURRENT STREAK",
                  current_streak,
                  PURPLE,
              ),
              (
                  "LONGEST STREAK",
                  longest_streak,
                  BLUE,
              ),
              (
                  "COMMITS",
                  total_commits,
                  GREEN,
              ),
              (
                  "PULL REQUESTS",
                  total_prs,
                  YELLOW,
              ),
          ]

          for index, (
              label,
              value,
              color,
          ) in enumerate(stats):

              x = (
                  120
                  + index * 215
              )

              svg += f'''

              <text
                x="{x}"
                y="345"
                fill="{color}"
                font-family="{FONT}"
                font-size="19"
                font-weight="700"
                text-anchor="middle">

                {number(value)}

              </text>

              <text
                x="{x}"
                y="365"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="8"
                text-anchor="middle">

                {label}

              </text>

              '''

          svg += f'''

          <text
            x="28"
            y="395"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="8">

            LONGEST STREAK:
            {date_text(longest_start)}
            — {date_text(longest_end)}

          </text>

          </svg>
          '''

          write(
              "profile-details.svg",
              svg
          )

          # ============================================================
          # CARD 2
          # STATS
          # ============================================================

          WIDTH = 420
          HEIGHT = 250

          svg = base_svg(
              WIDTH,
              HEIGHT,
              "GitHub Stats",
              f"@{USERNAME}"
          )

          stats = [
              ("COMMITS", total_commits, PINK),
              ("PULL REQUESTS", total_prs, PURPLE),
              ("ISSUES", total_issues, BLUE),
              (
                  "REPOSITORIES",
                  public_repos,
                  GREEN
              ),
              ("STARS", total_stars, YELLOW),
              ("FORKS", total_forks, ORANGE),
          ]

          positions = [
              (105, 105),
              (315, 105),
              (105, 170),
              (315, 170),
              (105, 215),
              (315, 215),
          ]

          for (
              label,
              value,
              color,
          ), (x, y) in zip(
              stats,
              positions
          ):

              svg += f'''

              <text
                x="{x}"
                y="{y}"
                fill="{color}"
                font-family="{FONT}"
                font-size="20"
                font-weight="700"
                text-anchor="middle">

                {number(value)}

              </text>

              <text
                x="{x}"
                y="{y + 16}"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="7"
                text-anchor="middle">

                {label}

              </text>

              '''

          svg += "</svg>"

          write(
              "stats.svg",
              svg
          )

          # ============================================================
          # CARD 3
          # REPOSITORIES PER LANGUAGE
          # ============================================================

          WIDTH = 420
          HEIGHT = 250

          svg = base_svg(
              WIDTH,
              HEIGHT,
              "Repositories",
              "Language distribution"
          )

          max_lang = max(
              (
                  percentage
                  for _, percentage
                  in repo_languages[:5]
              ),
              default=1
          )

          y = 95

          for index, (
              language,
              percentage,
          ) in enumerate(
              repo_languages[:5]
          ):

              color = COLORS[
                  index % len(COLORS)
              ]

              bar_width = (
                  235
                  * percentage
                  / max_lang
              )

              svg += f'''

              <text
                x="28"
                y="{y}"
                fill="{TEXT}"
                font-family="{FONT}"
                font-size="9"
                font-weight="700">

                {esc(language)}

              </text>

              <text
                x="390"
                y="{y}"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="8"
                text-anchor="end">

                {percentage:.1f}%

              </text>

              <rect
                x="28"
                y="{y + 8}"
                width="235"
                height="8"
                rx="4"
                fill="{PANEL}"/>

              <rect
                x="28"
                y="{y + 8}"
                width="{bar_width:.2f}"
                height="8"
                rx="4"
                fill="{color}"/>

              '''

              y += 30

          svg += "</svg>"

          write(
              "repos-per-language.svg",
              svg
          )

          # ============================================================
          # CARD 4
          # MOST COMMIT LANGUAGE
          # ============================================================

          WIDTH = 420
          HEIGHT = 250

          svg = base_svg(
              WIDTH,
              HEIGHT,
              "Most Used Languages",
              "Code distribution"
          )

          y = 100

          for index, (
              language,
              percentage,
          ) in enumerate(
              language_distribution[:5]
          ):

              color = COLORS[
                  index % len(COLORS)
              ]

              svg += f'''

              <circle
                cx="35"
                cy="{y - 4}"
                r="5"
                fill="{color}"/>

              <text
                x="50"
                y="{y}"
                fill="{TEXT}"
                font-family="{FONT}"
                font-size="10"
                font-weight="700">

                {esc(language)}

              </text>

              <text
                x="390"
                y="{y}"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="9"
                text-anchor="end">

                {percentage:.1f}%

              </text>

              '''

              y += 27

          svg += "</svg>"

          write(
              "most-commit-language.svg",
              svg
          )

          # ============================================================
          # CARD 5
          # STREAK
          # ============================================================

          WIDTH = 600
          HEIGHT = 220

          svg = base_svg(
              WIDTH,
              HEIGHT,
              "Contribution Streak",
              f"@{USERNAME}"
          )

          svg += f'''

          <text
            x="150"
            y="125"
            fill="{PINK}"
            font-family="{FONT}"
            font-size="32"
            font-weight="700"
            text-anchor="middle">

            {current_streak}

          </text>

          <text
            x="150"
            y="145"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="8"
            text-anchor="middle">

            CURRENT STREAK

          </text>

          <line
            x1="300"
            y1="95"
            x2="300"
            y2="170"
            stroke="{BORDER}"/>

          <text
            x="450"
            y="125"
            fill="{PURPLE}"
            font-family="{FONT}"
            font-size="32"
            font-weight="700"
            text-anchor="middle">

            {longest_streak}

          </text>

          <text
            x="450"
            y="145"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="8"
            text-anchor="middle">

            LONGEST STREAK

          </text>

          <text
            x="300"
            y="185"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="9"
            text-anchor="middle">

            {date_text(longest_start)}
            — {date_text(longest_end)}

          </text>

          </svg>
          '''

          write(
              "streak.svg",
              svg
          )

          print()
          print("======================================")
          print(" Self-hosted GitHub cards generated")
          print("======================================")
          print("profile/profile-details.svg")
          print("profile/stats.svg")
          print("profile/repos-per-language.svg")
          print("profile/most-commit-language.svg")
          print("profile/streak.svg")
          print("======================================")
          PY

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit \
            -m "Update GitHub profile stats" \
            || exit 0

          git push
