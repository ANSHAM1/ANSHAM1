name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # GitHub Readme Stats
      # ==========================================================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=ANSHAM1
            &show_icons=true
            &include_all_commits=true
            &count_private=true
            &hide_rank=true
            &theme=dracula
            &hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # Top Languages
      # ==========================================================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=ANSHAM1
            &layout=compact
            &langs_count=6
            &count_private=true
            &hide_border=true
            &theme=dracula
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # WakaTime
      # ==========================================================

      - name: Generate WakaTime Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: >-
            username=ANSHAM1
            &layout=compact
            &theme=dracula
            &hide_border=true
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # Pinned repositories
      # ==========================================================

      - name: Generate ExperimentOS card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=ANSHAM1
            &repo=ExperimentOS
            &theme=dracula
            &hide_border=true
          path: profile/experimentos.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate InsertionAI card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=ANSHAM1
            &repo=InsertionAI
            &theme=dracula
            &hide_border=true
          path: profile/insertionai.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # Commit
      # ==========================================================

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile cards" || exit 0

          git push
