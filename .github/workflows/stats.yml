name: Update GitHub Streak

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  streak:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Cards
        uses: tiennm99/ghstats@v1
        with:
          token: ${{ secrets.GHSTATS_TOKEN }}
          username: ANSHAM1
          themes: dracula
          output: profile

      - name: Keep only streak card
        run: |
          mkdir -p profile

          find profile -type f \
            ! -name "streak.svg" \
            -delete

          if [ -f profile/dracula/streak.svg ]; then
            cp profile/dracula/streak.svg profile/streak.svg
          fi

          rm -rf profile/dracula

      - name: Commit streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          git commit \
            -m "Update GitHub streak" \
            || exit 0

          git push
