name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ANSHAM1
        run: |
          mkdir -p profile

          python3 <<'PY'
          import json
          import math
          import os
          import html
          import urllib.request
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GH_TOKEN"]

          # ============================================================
          # DESIGN
          # ============================================================

          WIDTH = 1100
          HEIGHT = 760

          BG = "#282a36"
          PANEL = "#21222c"
          TEXT = "#f8f8f2"
          MUTED = "#6272a4"
          BORDER = "#44475a"

          PINK = "#ff79c6"
          PURPLE = "#bd93f9"
          BLUE = "#8be9fd"
          GREEN = "#50fa7b"
          YELLOW = "#f1fa8c"
          ORANGE = "#ffb86c"

          FONT = "Arial, Helvetica, sans-serif"

          COLORS = [
              PINK,
              PURPLE,
              BLUE,
              GREEN,
              YELLOW,
              ORANGE,
          ]

          # ============================================================
          # GITHUB API
          # ============================================================

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {

              login
              name
              createdAt

              followers {
                totalCount
              }

              following {
                totalCount
              }

              contributionsCollection(
                from: $from
                to: $to
              ) {

                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalRepositoryContributions

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {
                      date
                      contributionCount
                    }

                  }
                }
              }

              repositories(
                first: 100
                ownerAffiliations: OWNER
                privacy: PUBLIC
              ) {

                totalCount

                nodes {

                  name

                  stargazerCount
                  forkCount

                  primaryLanguage {
                    name
                  }

                  languages(
                    first: 20
                    orderBy: {
                      field: SIZE
                      direction: DESC
                    }
                  ) {

                    edges {

                      size

                      node {
                        name
                      }

                    }

                  }

                }

              }

            }
          }
          """

          now = datetime.now(timezone.utc)

          from_date = now - timedelta(days=365)

          variables = {
              "login": USERNAME,
              "from": from_date.strftime(
                  "%Y-%m-%dT00:00:00Z"
              ),
              "to": now.strftime(
                  "%Y-%m-%dT23:59:59Z"
              ),
          }

          payload = json.dumps({
              "query": query,
              "variables": variables,
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "ANSHAM1-github-stats",
              },
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(
                  response.read()
              )

          if "errors" in result:
              print(
                  json.dumps(
                      result["errors"],
                      indent=2,
                  )
              )
              raise SystemExit(
                  "GitHub GraphQL request failed"
              )

          user = result["data"]["user"]

          contributions = (
              user["contributionsCollection"]
          )

          calendar = (
              contributions["contributionCalendar"]
          )

          repositories = (
              user["repositories"]["nodes"]
          )

          # ============================================================
          # CONTRIBUTIONS
          # ============================================================

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days.sort(
              key=lambda x: x["date"]
          )

          graph_days = days[-365:]

          total_contributions = (
              calendar["totalContributions"]
          )

          total_commits = (
              contributions[
                  "totalCommitContributions"
              ]
          )

          total_prs = (
              contributions[
                  "totalPullRequestContributions"
              ]
          )

          total_issues = (
              contributions[
                  "totalIssueContributions"
              ]
          )

          # ============================================================
          # STREAK
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).date().isoformat()

          streak_days = days[:]

          if streak_days:

              last = streak_days[-1]

              if (
                  last["date"] == today
                  and last["contributionCount"] == 0
              ):
                  streak_days = streak_days[:-1]

          current_streak = 0

          for day in reversed(streak_days):

              if day["contributionCount"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0

          longest_start = None
          longest_end = None
          temp_start = None

          for day in days:

              if day["contributionCount"] > 0:

                  if temp_start is None:
                      temp_start = day["date"]

                  running += 1

                  if running > longest_streak:

                      longest_streak = running
                      longest_start = temp_start
                      longest_end = day["date"]

              else:

                  running = 0
                  temp_start = None

          # ============================================================
          # REPOSITORY LANGUAGE
          # ============================================================

          repo_languages = defaultdict(int)

          for repo in repositories:

              language = repo["primaryLanguage"]

              if language and language["name"]:

                  repo_languages[
                      language["name"]
                  ] += 1

          repo_total = sum(
              repo_languages.values()
          )

          repo_percentages = {}

          if repo_total:

              repo_percentages = {
                  key: (
                      value / repo_total
                  ) * 100
                  for key, value
                  in repo_languages.items()
              }

          repo_languages_sorted = sorted(
              repo_percentages.items(),
              key=lambda x: x[1],
              reverse=True,
          )[:5]

          # ============================================================
          # LANGUAGE ACTIVITY
          #
          # GitHub does not expose programming language for each
          # individual commit through contributionCalendar.
          #
          # Therefore this represents primary-language activity
          # across repositories.
          # ============================================================

          language_activity = defaultdict(float)

          for repo in repositories:

              primary = repo["primaryLanguage"]

              if primary and primary["name"]:

                  language_activity[
                      primary["name"]
                  ] += 1

          activity_total = sum(
              language_activity.values()
          )

          activity_percentages = {}

          if activity_total:

              activity_percentages = {
                  key: (
                      value / activity_total
                  ) * 100
                  for key, value
                  in language_activity.items()
              }

          activity_languages_sorted = sorted(
              activity_percentages.items(),
              key=lambda x: x[1],
              reverse=True,
          )[:5]

          # ============================================================
          # HELPERS
          # ============================================================

          def esc(value):
              return html.escape(
                  str(value)
              )

          def fmt_number(value):
              return f"{value:,}"

          def fmt_date(value):

              if not value:
                  return "N/A"

              date = datetime.strptime(
                  value,
                  "%Y-%m-%d"
              )

              return date.strftime(
                  "%d %b %Y"
              )

          # ============================================================
          # SVG
          # ============================================================

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="{WIDTH}"
          height="{HEIGHT}"
          viewBox="0 0 {WIDTH} {HEIGHT}">

          <defs>

            <linearGradient
              id="graphGradient"
              x1="0%"
              y1="0%"
              x2="100%"
              y2="0%">

              <stop
                offset="0%"
                stop-color="{PINK}"/>

              <stop
                offset="50%"
                stop-color="{PURPLE}"/>

              <stop
                offset="100%"
                stop-color="{BLUE}"/>

            </linearGradient>

            <linearGradient
              id="mountainGradient"
              x1="0%"
              y1="0%"
              x2="100%"
              y2="0%">

              <stop
                offset="0%"
                stop-color="{PINK}"
                stop-opacity="0.10"/>

              <stop
                offset="50%"
                stop-color="{PURPLE}"
                stop-opacity="0.30"/>

              <stop
                offset="100%"
                stop-color="{BLUE}"
                stop-opacity="0.10"/>

            </linearGradient>

          </defs>

          <!-- ====================================================== -->
          <!-- BACKGROUND -->
          <!-- ====================================================== -->

          <rect
            x="0"
            y="0"
            width="{WIDTH}"
            height="{HEIGHT}"
            rx="18"
            fill="{BG}"/>

          <!-- ====================================================== -->
          <!-- HEADER -->
          <!-- ====================================================== -->

          <text
            x="42"
            y="43"
            fill="{PINK}"
            font-family="{FONT}"
            font-size="25"
            font-weight="700">

            {esc(user["name"] or USERNAME)}

          </text>

          <text
            x="42"
            y="67"
            fill="{BLUE}"
            font-family="{FONT}"
            font-size="13">

            @{esc(USERNAME)}

          </text>

          <text
            x="1058"
            y="42"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="23"
            font-weight="700"
            text-anchor="end">

            {fmt_number(total_contributions)}

          </text>

          <text
            x="1058"
            y="64"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="10"
            text-anchor="end">

            CONTRIBUTIONS

          </text>

          <line
            x1="42"
            y1="88"
            x2="1058"
            y2="88"
            stroke="{BORDER}"
            stroke-width="1"/>

          <!-- ====================================================== -->
          <!-- CONTRIBUTION GRAPH SECTION -->
          <!-- ====================================================== -->

          <text
            x="42"
            y="116"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="13"
            font-weight="700">

            CONTRIBUTION ACTIVITY

          </text>

          <text
            x="1058"
            y="116"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="10"
            text-anchor="end">

            {fmt_date(graph_days[0]["date"])} — {fmt_date(graph_days[-1]["date"])}

          </text>
          '''

          # ============================================================
          # GRAPH
          # ============================================================

          GRAPH_X = 42
          GRAPH_Y = 132
          GRAPH_WIDTH = 1016
          GRAPH_HEIGHT = 175

          values = [
              day["contributionCount"]
              for day in graph_days
          ]

          maximum = max(
              values
          ) if values else 1

          points = []

          for index, value in enumerate(values):

              x = (
                  GRAPH_X
                  + (
                      index
                      / max(
                          1,
                          len(values) - 1
                      )
                  )
                  * GRAPH_WIDTH
              )

              normalized = (
                  value / maximum
              )

              y = (
                  GRAPH_Y
                  + GRAPH_HEIGHT
                  - (
                      normalized
                      * GRAPH_HEIGHT
                  )
              )

              points.append(
                  (x, y)
              )

          line_points = " ".join(
              f"{x:.2f},{y:.2f}"
              for x, y in points
          )

          polygon_points = (
              f"{GRAPH_X},{GRAPH_Y + GRAPH_HEIGHT} "
              + line_points
              + f" {GRAPH_X + GRAPH_WIDTH},{GRAPH_Y + GRAPH_HEIGHT}"
          )

          svg += f'''

          <polygon
            points="{polygon_points}"
            fill="url(#mountainGradient)"/>

          <polyline
            points="{line_points}"
            fill="none"
            stroke="url(#graphGradient)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"/>

          <line
            x1="{GRAPH_X}"
            y1="{GRAPH_Y + GRAPH_HEIGHT}"
            x2="{GRAPH_X + GRAPH_WIDTH}"
            y2="{GRAPH_Y + GRAPH_HEIGHT}"
            stroke="{BORDER}"
            stroke-width="1"/>

          '''

          # ============================================================
          # GRAPH DATES
          # ============================================================

          indexes = [
              0,
              len(graph_days) // 4,
              len(graph_days) // 2,
              (len(graph_days) * 3) // 4,
              len(graph_days) - 1,
          ]

          for index in indexes:

              index = max(
                  0,
                  min(
                      index,
                      len(graph_days) - 1
                  )
              )

              x = (
                  GRAPH_X
                  + (
                      index
                      / max(
                          1,
                          len(graph_days) - 1
                      )
                  )
                  * GRAPH_WIDTH
              )

              svg += f'''

              <text
                x="{x:.2f}"
                y="328"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="9"
                text-anchor="middle">

                {fmt_date(graph_days[index]["date"])}

              </text>

              '''

          # ============================================================
          # STREAK SECTION
          # ============================================================

          svg += f'''

          <rect
            x="42"
            y="350"
            width="1016"
            height="95"
            rx="10"
            fill="{PANEL}"
            stroke="{BORDER}"
            stroke-width="1"/>

          <text
            x="65"
            y="375"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9">

            STREAK

          </text>

          <text
            x="65"
            y="410"
            fill="{PINK}"
            font-family="{FONT}"
            font-size="25"
            font-weight="700">

            {current_streak}

          </text>

          <text
            x="65"
            y="429"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9">

            CURRENT DAYS

          </text>

          <line
            x1="250"
            y1="365"
            x2="250"
            y2="430"
            stroke="{BORDER}"/>

          <text
            x="280"
            y="410"
            fill="{PURPLE}"
            font-family="{FONT}"
            font-size="25"
            font-weight="700">

            {longest_streak}

          </text>

          <text
            x="280"
            y="429"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9">

            LONGEST DAYS

          </text>

          <line
            x1="475"
            y1="365"
            x2="475"
            y2="430"
            stroke="{BORDER}"/>

          <text
            x="505"
            y="391"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="8">

            LONGEST STREAK PERIOD

          </text>

          <text
            x="505"
            y="414"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="12"
            font-weight="700">

            {fmt_date(longest_start)} — {fmt_date(longest_end)}

          </text>

          <text
            x="505"
            y="432"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="8">

            FROM → TO

          </text>

          '''

          # ============================================================
          # ACTIVITY SECTION
          # ============================================================

          svg += f'''

          <rect
            x="42"
            y="460"
            width="1016"
            height="88"
            rx="10"
            fill="{PANEL}"
            stroke="{BORDER}"
            stroke-width="1"/>

          <text
            x="65"
            y="485"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9">

            CONTRIBUTION BREAKDOWN

          </text>

          '''

          activity_stats = [
              (
                  "COMMITS",
                  total_commits,
                  BLUE,
                  220
              ),
              (
                  "PULL REQUESTS",
                  total_prs,
                  GREEN,
                  440
              ),
              (
                  "ISSUES",
                  total_issues,
                  YELLOW,
                  660
              ),
              (
                  "REPOSITORY CONTRIBUTIONS",
                  contributions[
                      "totalRepositoryContributions"
                  ],
                  PINK,
                  890
              ),
          ]

          for label, value, color, x in activity_stats:

              svg += f'''

              <text
                x="{x}"
                y="520"
                fill="{color}"
                font-family="{FONT}"
                font-size="21"
                font-weight="700"
                text-anchor="middle">

                {fmt_number(value)}

              </text>

              <text
                x="{x}"
                y="537"
                fill="{MUTED}"
                font-family="{FONT}"
                font-size="8"
                text-anchor="middle">

                {label}

              </text>

              '''

          # ============================================================
          # LANGUAGE SECTION
          # ============================================================

          svg += f'''

          <text
            x="42"
            y="582"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="13"
            font-weight="700">

            LANGUAGE PROFILE

          </text>

          <text
            x="42"
            y="601"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="9">

            PRIMARY LANGUAGE DISTRIBUTION

          </text>

          <!-- LEFT PANEL -->

          <rect
            x="42"
            y="615"
            width="492"
            height="120"
            rx="10"
            fill="{PANEL}"
            stroke="{BORDER}"
            stroke-width="1"/>

          <text
            x="65"
            y="638"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="10"
            font-weight="700">

            BY REPOSITORY

          </text>

          <!-- RIGHT PANEL -->

          <rect
            x="566"
            y="615"
            width="492"
            height="120"
            rx="10"
            fill="{PANEL}"
            stroke="{BORDER}"
            stroke-width="1"/>

          <text
            x="589"
            y="638"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="10"
            font-weight="700">

            ACTIVITY BY PRIMARY LANGUAGE

          </text>

          '''

          # ============================================================
          # DONUT FUNCTION
          # ============================================================

          def donut(
              cx,
              cy,
              radius,
              thickness,
              values
          ):

              output = ""

              if not values:
                  return output

              circumference = (
                  2
                  * math.pi
                  * radius
              )

              offset = 0

              total = sum(
                  value
                  for _, value in values
              )

              if total <= 0:
                  return output

              for index, (
                  language,
                  percentage
              ) in enumerate(values):

                  color = COLORS[
                      index % len(COLORS)
                  ]

                  length = (
                      percentage
                      / 100
                  ) * circumference

                  dash_offset = -offset

                  output += f'''

                  <circle
                    cx="{cx}"
                    cy="{cy}"
                    r="{radius}"
                    fill="none"
                    stroke="{color}"
                    stroke-width="{thickness}"
                    stroke-dasharray="{length:.2f} {circumference:.2f}"
                    stroke-dashoffset="{dash_offset:.2f}"
                    transform="rotate(-90 {cx} {cy})"/>

                  '''

                  offset += length

              output += f'''

              <circle
                cx="{cx}"
                cy="{cy}"
                r="{radius - thickness / 2}"
                fill="{PANEL}"/>

              '''

              return output

          # ============================================================
          # DONUTS
          # ============================================================

          svg += donut(
              135,
              694,
              32,
              10,
              repo_languages_sorted
          )
          
          svg += donut(
              659,
              694,
              32,
              10,
              activity_languages_sorted
          )

          # ============================================================
          # DONUT CENTER
          # ============================================================

          repo_top = (
              repo_languages_sorted[0][0]
              if repo_languages_sorted
              else "N/A"
          )

          activity_top = (
              activity_languages_sorted[0][0]
              if activity_languages_sorted
              else "N/A"
          )

          svg += f'''

          <text
            x="135"
            y="680"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="9"
            font-weight="700"
            text-anchor="middle">

            {esc(repo_top)}

          </text>

          <text
            x="135"
            y="693"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="7"
            text-anchor="middle">

            TOP

          </text>

          <text
            x="659"
            y="680"
            fill="{TEXT}"
            font-family="{FONT}"
            font-size="9"
            font-weight="700"
            text-anchor="middle">

            {esc(activity_top)}

          </text>

          <text
            x="659"
            y="693"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="7"
            text-anchor="middle">

            TOP

          </text>

          '''

          # ============================================================
          # LANGUAGE LEGEND
          # ============================================================

          def legend(
              start_x,
              start_y,
              values
          ):

              output = ""

              for index, (
                  language,
                  percentage
              ) in enumerate(values):

                  color = COLORS[
                      index % len(COLORS)
                  ]

                  y = (
                      start_y
                      + index * 17
                  )

                  output += f'''

                  <circle
                    cx="{start_x}"
                    cy="{y - 3}"
                    r="3"
                    fill="{color}"/>

                  <text
                    x="{start_x + 9}"
                    y="{y}"
                    fill="{TEXT}"
                    font-family="{FONT}"
                    font-size="8">

                    {esc(language)}

                  </text>

                  <text
                    x="{start_x + 125}"
                    y="{y}"
                    fill="{MUTED}"
                    font-family="{FONT}"
                    font-size="8"
                    text-anchor="end">

                    {percentage:.1f}%

                  </text>

                  '''

              return output

          svg += legend(
              205,
              661,
              repo_languages_sorted
          )

          svg += legend(
              730,
              661,
              activity_languages_sorted
          )

          # ============================================================
          # FOOTER
          # ============================================================

          svg += f'''

          <text
            x="1058"
            y="751"
            fill="{MUTED}"
            font-family="{FONT}"
            font-size="8"
            text-anchor="end">

            GITHUB API • SELF-HOSTED SVG • UPDATED DAILY

          </text>

          </svg>
          '''

          # ============================================================
          # WRITE
          # ============================================================

          output = Path(
              "profile/contributions.svg"
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print()
          print("==========================================")
          print(" GitHub dashboard generated successfully")
          print("==========================================")
          print(
              f"Contributions : {total_contributions:,}"
          )
          print(
              f"Current streak: {current_streak}"
          )
          print(
              f"Longest streak: {longest_streak}"
          )
          print(
              f"Commits       : {total_commits:,}"
          )
          print(
              f"PRs           : {total_prs:,}"
          )
          print(
              f"Issues        : {total_issues:,}"
          )
          print(
              f"Graph         : {graph_days[0]['date']} -> {graph_days[-1]['date']}"
          )
          print()
          print(
              "Generated: profile/contributions.svg"
          )
          print("==========================================")

          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          git commit \
            -m "Update GitHub contribution dashboard" \
            || exit 0

          git push
