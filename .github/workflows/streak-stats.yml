name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          START_DATE=$(date -u -d "1 year ago" +"%Y-%m-%dT00:00:00Z")
          END_DATE=$(date -u +"%Y-%m-%dT23:59:59Z")

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d "$(jq -n \
              --arg login "ANSHAM1" \
              --arg from "$START_DATE" \
              --arg to "$END_DATE" \
              '{
                query: "query($login:String!, $from:DateTime!, $to:DateTime!) {
                  user(login:$login) {
                    name
                    login
                    createdAt
                    followers {
                      totalCount
                    }
                    following {
                      totalCount
                    }
                    repositories(ownerAffiliations:OWNER, first:100) {
                      totalCount
                      nodes {
                        name
                        stargazerCount
                        forkCount
                        primaryLanguage {
                          name
                        }
                      }
                    }
                    contributionsCollection(from:$from, to:$to) {
                      contributionCalendar {
                        totalContributions
                        weeks {
                          contributionDays {
                            date
                            contributionCount
                            weekday
                          }
                        }
                      }
                    }
                  }
                }",
                variables: {
                  login: $login,
                  from: $from,
                  to: $to
                }
              }')" \
            > profile/github-data.json

          echo "GitHub data fetched."

      - name: Generate custom SVG
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          data = json.loads(
              Path("profile/github-data.json").read_text()
          )

          user = data["data"]["user"]

          calendar = user["contributionsCollection"]["contributionCalendar"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days.sort(key=lambda x: x["date"])

          total = calendar["totalContributions"]

          # ---------------------------------------------------------
          # Calculate current streak
          # ---------------------------------------------------------

          current_streak = 0

          for day in reversed(days):
              if day["contributionCount"] > 0:
                  current_streak += 1
              else:
                  break

          # ---------------------------------------------------------
          # Calculate longest streak
          # ---------------------------------------------------------

          longest_streak = 0
          streak = 0

          for day in days:
              if day["contributionCount"] > 0:
                  streak += 1
                  longest_streak = max(longest_streak, streak)
              else:
                  streak = 0

          # ---------------------------------------------------------
          # Graph dimensions
          # ---------------------------------------------------------

          WIDTH = 1100
          HEIGHT = 430

          GRAPH_X = 80
          GRAPH_Y = 150

          GRAPH_WIDTH = 950
          GRAPH_HEIGHT = 190

          # ---------------------------------------------------------
          # Graph points
          # ---------------------------------------------------------

          values = [d["contributionCount"] for d in days]

          # Downsample if required
          MAX_POINTS = 365

          if len(values) > MAX_POINTS:
              values = values[-MAX_POINTS:]

          maximum = max(values) if values else 1

          points = []

          for i, value in enumerate(values):

              x = GRAPH_X + (
                  i / max(1, len(values) - 1)
              ) * GRAPH_WIDTH

              normalized = value / maximum

              y = (
                  GRAPH_Y
                  + GRAPH_HEIGHT
                  - normalized * GRAPH_HEIGHT
              )

              points.append((x, y))

          line_points = " ".join(
              f"{x:.2f},{y:.2f}"
              for x, y in points
          )

          # ---------------------------------------------------------
          # Mountain fill
          # ---------------------------------------------------------

          polygon_points = (
              f"{GRAPH_X},{GRAPH_Y + GRAPH_HEIGHT} "
              + line_points
              + f" {GRAPH_X + GRAPH_WIDTH},{GRAPH_Y + GRAPH_HEIGHT}"
          )

          # ---------------------------------------------------------
          # SVG
          # ---------------------------------------------------------

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}">

            <defs>

              <linearGradient
                id="mountain"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%">

                <stop
                  offset="0%"
                  stop-color="#ff79c6"
                  stop-opacity="0.20"/>

                <stop
                  offset="50%"
                  stop-color="#bd93f9"
                  stop-opacity="0.45"/>

                <stop
                  offset="100%"
                  stop-color="#8be9fd"
                  stop-opacity="0.25"/>

              </linearGradient>

              <linearGradient
                id="line"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%">

                <stop
                  offset="0%"
                  stop-color="#ff79c6"/>

                <stop
                  offset="50%"
                  stop-color="#bd93f9"/>

                <stop
                  offset="100%"
                  stop-color="#8be9fd"/>

              </linearGradient>

              <filter
                id="glow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"/>

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>

              </filter>

            </defs>

            <!-- Background -->

            <rect
              width="100%"
              height="100%"
              rx="18"
              fill="#282a36"/>

            <!-- Header -->

            <text
              x="45"
              y="55"
              fill="#ff79c6"
              font-size="27"
              font-family="Arial, Helvetica, sans-serif"
              font-weight="700">

              {user["name"] or user["login"]}

            </text>

            <text
              x="45"
              y="84"
              fill="#8be9fd"
              font-size="15"
              font-family="Arial, Helvetica, sans-serif">

              @{user["login"]}

            </text>

            <!-- Total -->

            <text
              x="850"
              y="55"
              fill="#f8f8f2"
              font-size="25"
              font-family="Arial, Helvetica, sans-serif"
              font-weight="700"
              text-anchor="end">

              {total}

            </text>

            <text
              x="850"
              y="79"
              fill="#6272a4"
              font-size="13"
              font-family="Arial, Helvetica, sans-serif"
              text-anchor="end">

              contributions / year

            </text>

            <!-- Divider -->

            <line
              x1="45"
              y1="105"
              x2="1055"
              y2="105"
              stroke="#44475a"
              stroke-width="1"/>

            <!-- Mountain glow -->

            <polyline
              points="{line_points}"
              fill="none"
              stroke="#bd93f9"
              stroke-width="8"
              opacity="0.15"
              filter="url(#glow)"/>

            <!-- Mountain -->

            <polygon
              points="{polygon_points}"
              fill="url(#mountain)"/>

            <!-- Graph line -->

            <polyline
              points="{line_points}"
              fill="none"
              stroke="url(#line)"
              stroke-width="3"
              stroke-linejoin="round"
              stroke-linecap="round"/>

            <!-- Baseline -->

            <line
              x1="{GRAPH_X}"
              y1="{GRAPH_Y + GRAPH_HEIGHT}"
              x2="{GRAPH_X + GRAPH_WIDTH}"
              y2="{GRAPH_Y + GRAPH_HEIGHT}"
              stroke="#44475a"
              stroke-width="1"/>

            <!-- Stats -->

            <line
              x1="300"
              y1="365"
              x2="300"
              y2="405"
              stroke="#44475a"/>

            <line
              x1="550"
              y1="365"
              x2="550"
              y2="405"
              stroke="#44475a"/>

            <line
              x1="800"
              y1="365"
              x2="800"
              y2="405"
              stroke="#44475a"/>

            <text
              x="175"
              y="385"
              fill="#ff79c6"
              font-size="20"
              font-family="Arial, Helvetica, sans-serif"
              font-weight="700"
              text-anchor="middle">

              {current_streak}

            </text>

            <text
              x="175"
              y="402"
              fill="#6272a4"
              font-size="11"
              font-family="Arial, Helvetica, sans-serif"
              text-anchor="middle">

              CURRENT STREAK

            </text>

            <text
              x="425"
              y="385"
              fill="#bd93f9"
              font-size="20"
              font-family="Arial, Helvetica, sans-serif"
              font-weight="700"
              text-anchor="middle">

              {longest_streak}

            </text>

            <text
              x="425"
              y="402"
              fill="#6272a4"
              font-size="11"
              font-family="Arial, Helvetica, sans-serif"
              text-anchor="middle">

              LONGEST STREAK

            </text>

            <text
              x="675"
              y="385"
              fill="#8be9fd"
              font-size="20"
              font-family="Arial, Helvetica, sans-serif"
              font-weight="700"
              text-anchor="middle">

              {user["followers"]["totalCount"]}

            </text>

            <text
              x="675"
              y="402"
              fill="#6272a4"
              font-size="11"
              font-family="Arial, Helvetica, sans-serif"
              text-anchor="middle">

              FOLLOWERS

            </text>

            <text
              x="925"
              y="385"
              fill="#f8f8f2"
              font-size="20"
              font-family="Arial, Helvetica, sans-serif"
              font-weight="700"
              text-anchor="middle">

              {user["repositories"]["totalCount"]}

            </text>

            <text
              x="925"
              y="402"
              fill="#6272a4"
              font-size="11"
              font-family="Arial, Helvetica, sans-serif"
              text-anchor="middle">

              PUBLIC REPOS

            </text>

          </svg>
          '''

          Path("profile/contributions.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print("Generated profile/contributions.svg")
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          git commit -m "Update GitHub contribution stats" || exit 0

          git push
