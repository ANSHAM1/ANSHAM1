<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1100"
    height="430"
    viewBox="0 0 1100 430">

    <defs>

      <linearGradient
        id="gradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%">

        <stop offset="0%" stop-color="#ff79c6"/>
        <stop offset="50%" stop-color="#bd93f9"/>
        <stop offset="100%" stop-color="#8be9fd"/>

      </linearGradient>

      <linearGradient
        id="mountain"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%">

        <stop
          offset="0%"
          stop-color="#ff79c6"
          stop-opacity="0.18"/>

        <stop
          offset="50%"
          stop-color="#bd93f9"
          stop-opacity="0.42"/>

        <stop
          offset="100%"
          stop-color="#8be9fd"
          stop-opacity="0.18"/>

      </linearGradient>

      <filter
        id="glow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">

        <feGaussianBlur
          stdDeviation="5"
          result="blur"/>

        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>

      </filter>

    </defs>

    <rect
      width="100%"
      height="100%"
      rx="18"
      fill="#282a36"/>

